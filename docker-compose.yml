version: "3.9"

services:

  # ── LLM Shield Gateway ─────────────────────────────────────────────────────
  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    container_name: llm-shield-gateway
    ports:
      - "8000:8000"
    environment:
      LLM_BACKEND_URL: "http://mock-llm:8001"
      OPA_URL: "http://opa:8181"
      AUDIT_DB_PATH: "/data/audit.db"
      BYPASS_OPA: "false"        # set to "true" to use fallback local policies
    volumes:
      - audit-data:/data
    depends_on:
      opa:
        condition: service_started
      mock-llm:
        condition: service_started
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Mock LLM Backend (no API key needed) ───────────────────────────────────
  mock-llm:
    build:
      context: ./mock_llm
      dockerfile: Dockerfile
    container_name: llm-shield-mock-llm
    ports:
      - "8001:8001"
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8001 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # ── Open Policy Agent ──────────────────────────────────────────────────────
  opa:
    image: openpolicyagent/opa:latest-rootless
    container_name: llm-shield-opa
    ports:
      - "8181:8181"
    command:
      - "run"
      - "--server"
      - "--log-level=info"
      - "--addr=0.0.0.0:8181"
      - "/policies"
    volumes:
      - ./policies:/policies:ro
    healthcheck:
      test: ["CMD", "sh", "-c", "exec 3<>/dev/tcp/127.0.0.1/8181 && echo -e 'GET /health HTTP/1.1\\r\\nHost: localhost\\r\\n\\r\\n' >&3 && cat <&3 | grep -q 'HTTP'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # ── Audit Dashboard (optional) ─────────────────────────────────────────────
  # Lightweight web UI to browse audit events in real time
  audit-ui:
    image: nginx:alpine
    container_name: llm-shield-audit-ui
    ports:
      - "3000:80"
    volumes:
      - ./docs/audit-ui:/usr/share/nginx/html:ro
    depends_on:
      - gateway

volumes:
  audit-data:
    driver: local
